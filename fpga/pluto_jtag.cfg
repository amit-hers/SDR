# Pluto+ Rev.5 onboard FT4232H ("Xilinx Debugger", 0403:6011).
# JTAG sits on FTDI channel 0; the other three channels are UARTs.
adapter driver ftdi
ftdi vid_pid 0x0403 0x6011
ftdi channel 0
ftdi layout_init 0x0088 0x008b
transport select jtag
adapter speed 1000

# Zynq-7020: PL TAP then the ARM DAP, as found by scan_chain.
jtag newtap zynq tap  -irlen 6 -expected-id 0x23727093
jtag newtap zynq cpu  -irlen 4 -expected-id 0x4ba00477
