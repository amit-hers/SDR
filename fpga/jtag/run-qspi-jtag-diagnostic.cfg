# RAM-only Pluto+ QSPI diagnostic.  No flash program/erase commands exist here.
init
adapter speed 6000
targets zynq.cpu0
halt

# Linux leaves virtual memory and caches enabled. Disable them before loading
# and executing an image addressed by physical DDR locations.
set s [arm mrc 15 0 1 0 0]
arm mcr 15 0 1 0 0 [expr {$s & ~((1<<0)|(1<<2)|(1<<12))}]

# Stop the 10-second watchdog while the Linux kernel is halted.
mww 0xF8005000 0x00ABC000

load_image /home/amither/Documents/SDR/diagnostic-u-boot-build/u-boot

reg cpsr 0x000001d3
reg r0 0
reg r1 0
reg r2 0
reg pc 0x04000000
resume

# U-Boot initialization, a 1 MiB QSPI read and SHA-256 complete well within
# this window. The diagnostic then spins without booting or writing flash.
sleep 15000
halt

echo "MAILBOX_WORDS_BEGIN"
read_memory 0x03000000 32 22
echo "MAILBOX_WORDS_END"
dump_image /home/amither/Documents/SDR/qspi-jtag-offset18MiB-1MiB-mailbox.bin 0x03000000 0x00000058
dump_image /home/amither/Documents/SDR/qspi-jtag-offset18MiB-1MiB.bin 0x02080000 0x00100000
shutdown
