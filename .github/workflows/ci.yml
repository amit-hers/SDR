name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libssl-dev libliquid-dev zstd shellcheck

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Build the link-test tool
        run: |
          g++ -O2 -std=c++17 -I include -o build/framed_link_test \
              fpga/tools/framed_link_test.cpp build/src/core/libsdr_core.a -lliquid -lcrypto

      # These run on the board and cannot be exercised in CI, so at least prove
      # they parse. A syntax error in a deployment script is only ever found at
      # the worst possible moment otherwise.
      - name: Shell scripts parse
        run: |
          for f in release/*.sh release/templates/*.sh fpga/scripts/*.sh scripts/*.sh; do
            [ -f "$f" ] || continue
            bash -n "$f" || sh -n "$f" || { echo "SYNTAX FAIL: $f"; exit 1; }
          done

      # cppcheck reasons across a whole translation unit and finds what neither
      # the compiler nor a test does: an inner condition that is always true, a
      # value computed and never read, a branch that cannot be reached. Scoped
      # to `warning` -- the style categories are 100+ findings of noise and a
      # gate nobody can keep green is a gate that gets disabled.
      - name: Static analysis (cppcheck)
        run: |
          sudo apt-get install -y cppcheck
          cppcheck --enable=warning --inline-suppr --std=c++17 \
            -I include -I src \
            --suppressions-list=.cppcheck-suppressions \
            --error-exitcode=1 src/ tests/ fpga/tools/

      # Sanitizers find what the assertions cannot: reads past the end of a
      # buffer, signed overflow, use-after-free. The decoders take input from
      # the network and the air, so this is the half of correctness that the
      # unit tests are structurally unable to cover.
      - name: Build with AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-asan -j"$(nproc)"

      - name: Unit tests under sanitizers
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build-asan --output-on-failure

      - name: Fuzz the decoders under sanitizers
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1
        run: ./build-asan/tests/sdr-fuzz 50000

      - name: Debug build
        run: |
          cmake -S . -B build-debug -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-debug -j"$(nproc)"
          ctest --test-dir build-debug --output-on-failure

      - name: Release tooling self-check
        run: |
          # A dev build needs no tag and no hardware, so the bundler itself is
          # exercised on every push rather than only at release time.
          ./release/build-release.sh v0.0.0-ci dev || true
          test -f out/pluto-datalink-v0.0.0-ci/manifest.json
          ( cd out/pluto-datalink-v0.0.0-ci && sha256sum -c --quiet checksums.sha256 )

      - name: Checksum tamper detection must work
        run: |
          # Proves acceptance criterion 3: a modified artifact is detected.
          B=out/pluto-datalink-v0.0.0-ci
          printf 'tampered' >> "$B/config/ad936x.conf"
          if ( cd "$B" && sha256sum -c --quiet checksums.sha256 ) 2>/dev/null; then
            echo "FAIL: checksum verification did not detect a modified file"; exit 1
          fi
          echo "OK: tampering detected"
