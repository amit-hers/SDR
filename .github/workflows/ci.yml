name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libssl-dev libliquid-dev zstd shellcheck \
                                  g++-arm-linux-gnueabihf qemu-user-static libiio-dev

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Build the link-test tool
        run: |
          g++ -O2 -std=c++17 -I include -o build/framed_link_test \
              fpga/tools/framed_link_test.cpp build/src/core/libsdr_core.a -lliquid -lcrypto

      # The bridge is the binary that actually ships to the board, and until now
      # nothing in CI built it. It is also the only ARMv7 artifact, so building
      # it here is what catches assumptions that hold on x86 and not on the
      # target: `long` and `size_t` are 4 bytes there and plain `char` is
      # unsigned. Installing the cross toolchain additionally un-skips the
      # cross-architecture half of the wire-conformance test above, which is
      # otherwise silently skipped on every run.
      - name: Cross-build the bridge for ARMv7
        run: ./fpga/tools/build_bridge.sh

      - name: The ARM binary runs
        run: |
          # A static binary that will not start on the target is a release
          # nobody can use, and the board is not here to ask.
          qemu-arm-static build/sdr_bridge --help > /tmp/help.txt 2>&1
          grep -q -- '--local' /tmp/help.txt || { cat /tmp/help.txt; exit 1; }
          qemu-arm-static build/bridge_bench 2 4096 > /tmp/bench.txt 2>&1
          grep -q 'RX 4-offset' /tmp/bench.txt || { cat /tmp/bench.txt; exit 1; }
          echo "OK: ARMv7 binaries execute"

      # Unit tests cover the codec; they cannot say whether the process carries
      # a packet. This runs two bridges with real TUNs in separate namespaces
      # and pings across. It skips itself where TUN or netns are unavailable,
      # so it gates without going red for reasons unrelated to the code.
      - name: Bridge carries IP end to end
        run: sudo ./tests/bridge_e2e_test.sh "$PWD"

      # These run on the board and cannot be exercised in CI, so at least prove
      # they parse. A syntax error in a deployment script is only ever found at
      # the worst possible moment otherwise.
      - name: Shell scripts parse
        run: |
          for f in release/*.sh release/templates/*.sh fpga/scripts/*.sh scripts/*.sh; do
            [ -f "$f" ] || continue
            bash -n "$f" || sh -n "$f" || { echo "SYNTAX FAIL: $f"; exit 1; }
          done

      # cppcheck reasons across a whole translation unit and finds what neither
      # the compiler nor a test does: an inner condition that is always true, a
      # value computed and never read, a branch that cannot be reached. Scoped
      # to `warning` -- the style categories are 100+ findings of noise and a
      # gate nobody can keep green is a gate that gets disabled.
      - name: Static analysis (cppcheck)
        run: |
          sudo apt-get install -y cppcheck
          cppcheck --enable=warning --inline-suppr --std=c++17 \
            -I include -I src \
            --suppressions-list=.cppcheck-suppressions \
            --error-exitcode=1 src/ tests/ fpga/tools/

      # Sanitizers find what the assertions cannot: reads past the end of a
      # buffer, signed overflow, use-after-free. The decoders take input from
      # the network and the air, so this is the half of correctness that the
      # unit tests are structurally unable to cover.
      - name: Build with AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-asan -j"$(nproc)"

      - name: Unit tests under sanitizers
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build-asan --output-on-failure

      - name: Fuzz the decoders under sanitizers
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1
        run: ./build-asan/tests/sdr-fuzz 50000

      - name: Debug build
        run: |
          cmake -S . -B build-debug -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-debug -j"$(nproc)"
          ctest --test-dir build-debug --output-on-failure

      - name: Release tooling self-check
        run: |
          # A dev build needs no tag and no hardware, so the bundler itself is
          # exercised on every push rather than only at release time.
          ./release/build-release.sh v0.0.0-ci dev
          test -f out/pluto-datalink-v0.0.0-ci/manifest.json
          python3 -c 'import json; assert json.load(open("out/pluto-datalink-v0.0.0-ci/manifest.json"))["fpga_included"] is False'
          ( cd out/pluto-datalink-v0.0.0-ci && sha256sum -c --quiet checksums.sha256 )
          # build-release.sh only WARNS when the cross toolchain is absent, so a
          # bundle can be assembled, checksummed and published while carrying no
          # bridge at all -- a release that brings the radio up and cannot pass
          # traffic. Assert the artifact is present and runnable, not merely
          # that the bundler exited cleanly.
          B=out/pluto-datalink-v0.0.0-ci
          test -f "$B/software/sdr_bridge" \
            || { echo "FAIL: bundle carries no sdr_bridge"; exit 1; }
          qemu-arm-static "$B/software/sdr_bridge" --help >/dev/null 2>&1 \
            || { echo "FAIL: bundled sdr_bridge does not execute"; exit 1; }
          test -f "$B/software/supporting-tools/bridge_up.sh" \
            || { echo "FAIL: bundle carries no bridge_up.sh"; exit 1; }
          echo "OK: bundle carries a runnable ARMv7 bridge"

      - name: Checksum tamper detection must work
        run: |
          # Proves acceptance criterion 3: a modified artifact is detected.
          B=out/pluto-datalink-v0.0.0-ci
          printf 'tampered' >> "$B/config/ad936x.conf"
          if ( cd "$B" && sha256sum -c --quiet checksums.sha256 ) 2>/dev/null; then
            echo "FAIL: checksum verification did not detect a modified file"; exit 1
          fi
          echo "OK: tampering detected"
