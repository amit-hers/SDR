# OpenOCD 0.12: Zynq-7020 via FT4232H — single shot recovery config
adapter driver ftdi
ftdi vid_pid 0x0403 0x6011
ftdi channel 0
ftdi layout_init 0x0018 0x001b
adapter speed 500

transport select jtag
reset_config none

jtag newtap zynq pl  -irlen 6 -ircapture 0x01 -irmask 0x03 -expected-id 0x23727093
jtag newtap zynq dap -irlen 4 -ircapture 0x01 -irmask 0x0f -expected-id 0x4ba00477

dap create zynq.dap -chain-position zynq.dap

target create zynq.cpu0 cortex_a \
    -dap zynq.dap \
    -coreid 0 \
    -dbgbase 0x80090000

zynq.cpu0 configure \
    -work-area-phys 0x00100000 \
    -work-area-size 0x40000 \
    -work-area-backup 0

# Called after init — do full recovery in one shot
proc do_recovery {} {
    echo "=== Zynq JTAG Recovery ==="

    # Force examination 
    zynq.cpu0 arp_examine
    after 200

    halt
    after 500

    echo "Step 1: CPU halted"

    # Disable MMU so memory writes work physically
    set sctlr [arm mrc 15 0 1 0 0]
    echo "  SCTLR=0x[format %08X $sctlr]"
    arm mcr 15 0 1 0 0 [expr {$sctlr & ~0x1005}]
    echo "  MMU disabled"

    # Load FSBL to OCM
    echo "Step 2: Loading FSBL (98KB) to OCM 0xFFFC0000..."
    load_image /home/parallels/Documents/SDR/recovery/fsbl.bin 0xFFFC0000 bin
    
    # Verify
    set word0 [read_memory 0xFFFC0000 32 1]
    echo "  Verify: word0=0x[format %08X $word0] (expect 0xEA000049)"

    # Set up stack and jump to FSBL
    echo "Step 3: Jumping to FSBL..."
    reg sp 0xFFFF0000
    reg pc 0xFFFC0000
    reg cpsr 0x000000D3   ;# SVC mode, IRQ+FIQ disabled

    resume
    echo "Step 4: FSBL running — check serial console ttyUSB1 at 115200"
    echo "=== Done — wait 20s then check if USB OTG appears ==="
}
